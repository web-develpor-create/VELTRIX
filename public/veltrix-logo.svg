<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 80" fill="none">
  <defs>
    <linearGradient id="vgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="60%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <linearGradient id="xgrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- V mark -->
  <g filter="url(#glow)">
    <path d="M8 14 L24 14 L40 54 L56 14 L72 14 L48 66 L32 66 Z"
          fill="url(#vgrad)"/>
    <!-- silver/white accent slash -->
    <path d="M30 18 L40 18 L44 28 L36 30 Z" fill="#e5e7eb" opacity="0.85"/>
  </g>

  <!-- Wordmark VELTRI -->
  <text x="86" y="52"
        font-family="'Geist', 'Inter', system-ui, sans-serif"
        font-size="34" font-weight="700"
        letter-spacing="2"
        fill="#ffffff">VELTRI</text>
  <!-- X with gradient -->
  <text x="247" y="52"
        font-family="'Geist', 'Inter', system-ui, sans-serif"
        font-size="34" font-weight="700"
        letter-spacing="2"
        fill="url(#xgrad)">X</text>
</svg>
