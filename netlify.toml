# ============================================================
#  VELTRIX — Netlify deployment configuration
#  Docs: https://docs.netlify.com/configure-builds/file-based-configuration/
# ============================================================

[build]
  command = "bun run db:generate && bun run build"
  # Netlify's Next.js runtime packages the pages and server routes from .next.
  publish = ".next"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"
  # Allow the existing dependency tree during npm installation.
  NPM_FLAGS = "--legacy-peer-deps"
  # Environment variables must be strings, not nested TOML tables.
  PRISMA_CLI_QUERY_ENGINE_TYPE = "binary"

# ============================================================
#  Headers — security hardening
# ============================================================

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"

# Static assets get long-lived cache
[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# ============================================================
#  SPA fallback — Veltrix is a single-page app, but Next.js
#  handles routing for /api/* server-side functions.
# ============================================================

# All non-file requests fall through to Next.js (handled by the Next runtime plugin)

# ============================================================
#  Required environment variables (set in Netlify dashboard)
# ============================================================
#
#  DATABASE_URL           — postgres connection string (Neon, Supabase, etc.)
#                           e.g. "postgresql://user:pass@host/db?sslmode=require"
#  ENCRYPTION_KEY         — 32+ char random string, used to encrypt user hosting tokens
#                           Generate: openssl rand -base64 48
#  NEXTAUTH_SECRET        — fallback key derivation if ENCRYPTION_KEY is unset
#                           Generate: openssl rand -base64 32
#
#  HOSTING_PROVIDER       — "netlify" (default) or "cloudflare_pages"
#  FREE_PLAN_WEBSITE_LIMIT — per-user website cap (default: 5)
#  FREE_PLAN_DEPLOY_LIMIT  — per-user monthly deploy cap (default: 100)
#
#  --- Optional (Cloudflare Pages mode only) ---
#  CF_ACCOUNT_ID          — your Cloudflare account ID
#
#  --- Optional (email features) ---
#  EMAIL_SERVER           — SMTP URL e.g. "smtps://user:pass@smtp.mailgun.org:465"
#  EMAIL_FROM             — e.g. "VELTRIX <noreply@yourdomain.com>"
#
#  --- Optional (Postgres on Netlify) ---
#  NETLIFY_DATABASE_URL   — alternative env name; ensure DATABASE_URL is set
#                           to the same value in production.
